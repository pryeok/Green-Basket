plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.greenbasket'
version = '1.0.0'
sourceCompatibility = '21'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.0")
}

dependencies {
    // Common Modules
    implementation project(':common:jwt')

    // API Gateway Core - WebFlux 기반 비동기 게이트웨이 서버
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    // Service Discovery - Eureka 클라이언트 (서비스 등록 및 발견)
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // Development Tools - 개발 시 자동 재시작 (운영환경에서 비활성화됨)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Config Service
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'

    // Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Message Bus - RabbitMQ를 통한 설정 변경 실시간 반영
    implementation 'org.springframework.cloud:spring-cloud-starter-bus-amqp'

    // Test - 테스트 라이브러리들 (JUnit 5, Mockito, AssertJ 등)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

test {
    useJUnitPlatform()
}