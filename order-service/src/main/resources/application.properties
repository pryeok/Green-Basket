server.port=0

spring.application.name=order-service


# RabbitMQ Configuration - Disabled
spring.cloud.bus.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false

# MySQL Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/order_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=greenbasket
spring.datasource.password=greenbasket

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Client
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.userservice.client=DEBUG

# Management Endpoints
management.endpoints.web.exposure.include=refresh,health,beans,info
management.health.rabbit.enabled=false